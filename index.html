<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>温湿度实时监控</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background: linear-gradient(135deg, #d6eaff 0%, #e6f3ff 50%, #cfe8ff 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 30px 20px;
        }

        .dashboard {
            width: 100%;
            max-width: 720px;
        }

        h1 {
            text-align: center;
            font-size: 32px;
            color: #1a5276;
            margin-bottom: 8px;
        }

        .status {
            text-align: center;
            font-size: 14px;
            color: #666;
            margin-bottom: 24px;
        }

        .status .dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ccc;
            margin-right: 6px;
        }

        .status.connected .dot { background: #27ae60; }

        .nav {
            text-align: center;
            margin-bottom: 24px;
        }

        .nav a {
            color: #5dade2;
            text-decoration: none;
            font-size: 15px;
        }

        .nav a:hover { text-decoration: underline; }

        .cards {
            display: flex;
            gap: 20px;
            margin-bottom: 24px;
        }

        .card {
            flex: 1;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(26, 82, 118, 0.12);
            padding: 28px;
            text-align: center;
        }

        .card .label {
            font-size: 16px;
            color: #666;
            margin-bottom: 10px;
        }

        .card .value {
            font-size: 44px;
            font-weight: bold;
            color: #1a5276;
        }

        .card .unit {
            font-size: 20px;
            color: #5dade2;
        }

        .table-box {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(26, 82, 118, 0.12);
            padding: 24px;
        }

        .table-box h2 {
            font-size: 18px;
            color: #1a5276;
            margin-bottom: 12px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 10px;
            text-align: center;
            border-bottom: 1px solid #dce9f5;
            font-size: 15px;
            color: #333;
        }

        th {
            background: #eaf4fd;
            color: #1a5276;
        }

        .empty {
            text-align: center;
            color: #999;
            padding: 20px;
        }

        @media (max-width: 480px) {
            h1 { font-size: 24px; }
            .cards { flex-direction: column; }
            .card .value { font-size: 36px; }
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <h1>温湿度实时监控</h1>
        <div class="status" id="status"><span class="dot"></span>正在连接服务器…</div>
        <div class="nav"><a href="/history">查看历史图表 →</a></div>

        <div class="cards">
            <div class="card">
                <div class="label">当前温度</div>
                <div><span class="value" id="temp">--</span><span class="unit"> ℃</span></div>
            </div>
            <div class="card">
                <div class="label">当前湿度</div>
                <div><span class="value" id="humi">--</span><span class="unit"> %RH</span></div>
            </div>
        </div>

        <div class="table-box">
            <h2>最近数据记录</h2>
            <table>
                <thead>
                    <tr><th>时间</th><th>温度 (℃)</th><th>湿度 (%RH)</th></tr>
                </thead>
                <tbody id="tbody">
                    <tr><td colspan="3" class="empty">暂无数据，等待设备上报…</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const tbody = document.getElementById('tbody');
        const tempEl = document.getElementById('temp');
        const humiEl = document.getElementById('humi');
        const statusEl = document.getElementById('status');

        function render(data) {
            tbody.innerHTML = '';
            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" class="empty">暂无数据，等待设备上报…</td></tr>';
                return;
            }
            data.forEach(d => {
                const tr = document.createElement('tr');
                tr.innerHTML = `<td>${d.time}</td><td>${d.temperature}</td><td>${d.humidity}</td>`;
                tbody.appendChild(tr);
            });
            tempEl.textContent = data[0].temperature;
            humiEl.textContent = data[0].humidity;
        }

        function prepend(d) {
            const emptyRow = tbody.querySelector('.empty');
            if (emptyRow) tbody.innerHTML = '';
            const tr = document.createElement('tr');
            tr.innerHTML = `<td>${d.time}</td><td>${d.temperature}</td><td>${d.humidity}</td>`;
            tbody.prepend(tr);
            while (tbody.rows.length > 50) tbody.deleteRow(-1);
            tempEl.textContent = d.temperature;
            humiEl.textContent = d.humidity;
        }

        // 页面加载时先拉取历史数据
        fetch('/api/history')
            .then(r => r.json())
            .then(render);

        // 通过 SSE 接收服务器推送的实时数据
        const es = new EventSource('/events');
        es.onopen = () => {
            statusEl.className = 'status connected';
            statusEl.innerHTML = '<span class="dot"></span>已连接，实时接收中';
        };
        es.onmessage = e => prepend(JSON.parse(e.data));
        es.onerror = () => {
            statusEl.className = 'status';
            statusEl.innerHTML = '<span class="dot"></span>连接断开，正在重连…';
        };
    </script>
</body>
</html>
