<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人主页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background: linear-gradient(135deg, #d6eaff 0%, #e6f3ff 50%, #cfe8ff 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.85);
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(26, 82, 118, 0.15);
            padding: 60px 50px;
            max-width: 640px;
            width: 100%;
            text-align: center;
        }

        .avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: linear-gradient(135deg, #5dade2, #1a5276);
            color: #fff;
            font-size: 44px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 28px;
            box-shadow: 0 6px 18px rgba(26, 82, 118, 0.3);
        }

        h1 {
            font-size: 44px;
            color: #1a5276;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        .divider {
            width: 60px;
            height: 4px;
            background: #5dade2;
            border-radius: 2px;
            margin: 0 auto 28px;
        }

        .intro {
            font-size: 18px;
            color: #444;
            line-height: 2;
            text-align: justify;
        }

        @media (max-width: 480px) {
            .card {
                padding: 40px 28px;
            }
            h1 {
                font-size: 32px;
            }
            .intro {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="avatar">明</div>
        <h1>你好，我是小明</h1>
        <div class="divider"></div>
        <p class="intro">
            欢迎来到我的个人主页！我热爱编程与设计，喜欢探索新技术，平时也爱阅读和旅行。
            我相信技术可以让生活变得更美好，也一直在学习和成长的道路上。
            希望在这里与你分享我的作品与想法，期待与你的交流！
        </p>
    </div>
</body>
</html>
